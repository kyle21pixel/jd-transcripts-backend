<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | JD Reporting</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
    <style>
        body { background: #f5f7fb; }
        .sidebar {
            background: rgba(255,255,255,0.6);
            border-radius: 18px;
            box-shadow: 0 4px 24px rgba(60,60,120,0.08);
            padding: 32px 0 0 0;
            height: calc(100vh - 80px);
            position: sticky;
            top: 80px;
            flex-direction: row;
            height: auto;
            min-width: 0;
            max-width: none;
            padding: 0;
            border-radius: 0;
            box-shadow: none;
            position: static;
            top: auto;
        }
        .sidebar-link {
            flex: 1;
            justify-content: center;
            padding: 10px 2px;
            font-size: 1rem;
        }
        @media (max-width: 600px) {
            .sidebar-link {
                font-size: 0.95rem;
                padding: 8px 2px;
            }
        }
        .dashboard-content { margin-left: 260px; padding: 2rem; }
        @media (max-width: 991px) { .dashboard-content { margin-left: 0; } .sidebar { min-height: auto; } }
    </style>
</head>
<body>
    <div class="d-flex">
        <nav class="sidebar flex-shrink-0 p-3" style="width: 260px;">
            <a href="/admin-dashboard.html" class="d-flex align-items-center mb-3 mb-md-0 me-md-auto text-white text-decoration-none">
                <span class="fs-4 fw-bold">JD Reporting Admin</span>
            </a>
            <hr>
            <ul class="nav nav-pills flex-column mb-auto">
                <li class="nav-item"><a href="/admin-dashboard.html" class="nav-link active">Dashboard</a></li>
                <li><a href="#" class="nav-link" id="navTranscribers">Transcribers</a></li>
                <li><a href="#" class="nav-link" id="navClients">Clients</a></li>
                <li><a href="#" class="nav-link" id="navOrders">Orders</a></li>
                <li><a href="#" class="nav-link" id="navAnalytics">Analytics</a></li>
            </ul>
            <hr>
            <div class="dropdown">
                <a href="#" class="d-flex align-items-center text-white text-decoration-none dropdown-toggle" data-bs-toggle="dropdown">
                    <img src="/images/admin-avatar.png" alt="admin" width="32" height="32" class="rounded-circle me-2">
                    <strong>Admin</strong>
                </a>
                <ul class="dropdown-menu dropdown-menu-dark text-small shadow">
                    <li><a class="dropdown-item" href="#" id="logoutBtn">Sign out</a></li>
                </ul>
            </div>
        </nav>
        <main class="dashboard-content flex-grow-1">
            <div id="dashboardView">
                <h2 class="mb-4">Dashboard Overview</h2>
                <div class="row mb-4" id="statsRow">
                    <!-- Stats will be loaded here -->
                </div>
                <div class="card mb-4">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h5 class="mb-0">Recent Orders</h5>
                        <button class="btn btn-sm btn-outline-primary" id="refreshOrdersBtn">Refresh</button>
                    </div>
                    <div class="table-responsive">
                        <table class="table table-striped" id="ordersTable">
                            <thead>
                                <tr>
                                    <th>Order #</th>
                                    <th>Client</th>
                                    <th>Service</th>
                                    <th>Status</th>
                                    <th>Created</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/admin-dashboard.js"></script>
</body>
</html>
