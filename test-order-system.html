<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order System - Connection Test</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            min-height: 100vh;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        
        h1 {
            color: #333;
            margin-bottom: 20px;
        }
        
        .test-button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 1.1em;
            cursor: pointer;
            margin: 10px 5px;
            transition: transform 0.2s;
        }
        
        .test-button:hover {
            transform: translateY(-2px);
        }
        
        .result {
            margin-top: 20px;
            padding: 20px;
            border-radius: 10px;
            display: none;
        }
        
        .success {
            background: #dcfce7;
            border: 2px solid #10b981;
            color: #065f46;
        }
        
        .error {
            background: #fee2e2;
            border: 2px solid #ef4444;
            color: #991b1b;
        }
        
        .info {
            background: #e0e7ff;
            border: 2px solid #667eea;
            color: #3730a3;
        }
        
        pre {
            background: #1e293b;
            color: #e2e8f0;
            padding: 15px;
            border-radius: 8px;
            overflow-x: auto;
            margin-top: 10px;
        }
        
        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }
        
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔧 Order System - Connection Test</h1>
        <p style="color: #666; margin-bottom: 30px;">Test your order submission system</p>
        
        <div>
            <button class="test-button" onclick="testConnection()">🔍 Test API Connection</button>
            <button class="test-button" onclick="testSubmitOrder()">📝 Test Submit Order</button>
            <button class="test-button" onclick="viewOrders()">📊 View All Orders</button>
        </div>
        
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p style="margin-top: 10px; color: #667eea;">Testing...</p>
        </div>
        
        <div class="result" id="result"></div>
    </div>
    
    <script>
        async function testConnection() {
            const resultDiv = document.getElementById('result');
            const loading = document.getElementById('loading');
            
            resultDiv.style.display = 'none';
            loading.style.display = 'block';
            
            try {
                const response = await fetch('/php_backend/api/orders.php', {
                    method: 'GET'
                });
                
                const data = await response.json();
                
                loading.style.display = 'none';
                resultDiv.className = 'result success';
                resultDiv.style.display = 'block';
                resultDiv.innerHTML = `
                    <h3>✅ Connection Successful!</h3>
                    <p>API is responding correctly.</p>
                    <p><strong>Orders in database:</strong> ${data.count}</p>
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                `;
            } catch (error) {
                loading.style.display = 'none';
                resultDiv.className = 'result error';
                resultDiv.style.display = 'block';
                resultDiv.innerHTML = `
                    <h3>❌ Connection Failed</h3>
                    <p>${error.message}</p>
                    <p><strong>Possible issues:</strong></p>
                    <ul>
                        <li>PHP backend folder not in htdocs</li>
                        <li>Apache not running in XAMPP</li>
                        <li>MySQL not running on port 3307</li>
                    </ul>
                `;
            }
        }
        
        async function testSubmitOrder() {
            const resultDiv = document.getElementById('result');
            const loading = document.getElementById('loading');
            
            resultDiv.style.display = 'none';
            loading.style.display = 'block';
            
            const testOrder = {
                client_name: 'Test Customer ' + Date.now(),
                client_email: 'test@example.com',
                client_phone: '555-0123',
                service_type: 'legal',
                turnaround: '24h',
                file_name: 'test_audio.mp3',
                special_instructions: 'This is a test order from diagnostic page'
            };
            
            try {
                const response = await fetch('/php_backend/api/orders.php', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(testOrder)
                });
                
                const data = await response.json();
                
                loading.style.display = 'none';
                
                if (data.success) {
                    resultDiv.className = 'result success';
                    resultDiv.style.display = 'block';
                    resultDiv.innerHTML = `
                        <h3>✅ Order Submitted Successfully!</h3>
                        <p><strong>Order Number:</strong> ${data.order.order_number}</p>
                        <p><strong>Estimated Cost:</strong> $${data.order.estimated_cost}</p>
                        <p><strong>Status:</strong> ${data.order.status}</p>
                        <p style="margin-top: 15px;">
                            <a href="http://localhost:8080/phpmyadmin/index.php?route=/sql&db=jd_reporting_company&table=orders&pos=0" 
                               target="_blank" 
                               style="color: #667eea; text-decoration: underline;">
                                View in phpMyAdmin →
                            </a>
                        </p>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    `;
                } else {
                    throw new Error(data.error || 'Order submission failed');
                }
            } catch (error) {
                loading.style.display = 'none';
                resultDiv.className = 'result error';
                resultDiv.style.display = 'block';
                resultDiv.innerHTML = `
                    <h3>❌ Order Submission Failed</h3>
                    <p>${error.message}</p>
                    <p><strong>Check:</strong></p>
                    <ul>
                        <li>Browser console for detailed errors (F12)</li>
                        <li>PHP error logs in C:\\xampp\\apache\\logs\\error.log</li>
                        <li>MySQL is running and accessible</li>
                    </ul>
                `;
            }
        }
        
        function viewOrders() {
            window.open('http://localhost:8080/phpmyadmin/index.php?route=/sql&db=jd_reporting_company&table=orders&pos=0', '_blank');
        }
    </script>
</body>
</html>
