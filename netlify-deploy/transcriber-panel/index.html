<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - JD Transcriber Panel</title>
    <link rel="stylesheet" href="assets/css/transcriber-style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="admin-layout">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <a href="index.html" class="sidebar-logo">
                    <i class="fas fa-headset"></i>
                    <span>JD Transcriber</span>
                </a>
            </div>
            <nav class="sidebar-nav">
                <ul>
                    <li class="nav-item">
                        <a href="index.html" class="nav-link active">
                            <i class="fas fa-chart-line"></i>
                            <span>Dashboard</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="my-orders.html" class="nav-link">
                            <i class="fas fa-tasks"></i>
                            <span>My Orders</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="available-orders.html" class="nav-link">
                            <i class="fas fa-shopping-cart"></i>
                            <span>Available Orders</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="performance.html" class="nav-link">
                            <i class="fas fa-chart-bar"></i>
                            <span>Performance</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="../index.html" class="nav-link">
                            <i class="fas fa-home"></i>
                            <span>Back to Website</span>
                        </a>
                    </li>
                </ul>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div class="top-bar">
                <h1 class="page-title">Dashboard</h1>
                <div class="top-bar-actions">
                    <button class="btn btn-primary" onclick="window.location.reload()">
                        <i class="fas fa-sync-alt"></i> Refresh
                    </button>
                </div>
            </div>

            <!-- Statistics Grid -->
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-icon primary">
                        <i class="fas fa-tasks"></i>
                    </div>
                    <div class="stat-info">
                        <div class="stat-label">Assigned Orders</div>
                        <div class="stat-value" id="assignedOrders">-</div>
                    </div>
                </div>

                <div class="stat-card">
                    <div class="stat-icon info">
                        <i class="fas fa-spinner"></i>
                    </div>
                    <div class="stat-info">
                        <div class="stat-label">In Progress</div>
                        <div class="stat-value" id="inProgressOrders">-</div>
                    </div>
                </div>

                <div class="stat-card">
                    <div class="stat-icon success">
                        <i class="fas fa-check-circle"></i>
                    </div>
                    <div class="stat-info">
                        <div class="stat-label">Completed</div>
                        <div class="stat-value" id="completedOrders">-</div>
                    </div>
                </div>

                <div class="stat-card">
                    <div class="stat-icon warning">
                        <i class="fas fa-dollar-sign"></i>
                    </div>
                    <div class="stat-info">
                        <div class="stat-label">Total Earnings</div>
                        <div class="stat-value" id="totalEarnings">$0</div>
                    </div>
                </div>
            </div>

            <!-- Recent Orders -->
            <div class="card">
                <div class="card-header">
                    <h2 class="card-title">My Recent Orders</h2>
                    <a href="my-orders.html" class="btn btn-outline btn-sm">View All</a>
                </div>
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Order #</th>
                                <th>Client</th>
                                <th>Service</th>
                                <th>Status</th>
                                <th>Deadline</th>
                                <th>Amount</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="recentOrdersTable">
                            <tr>
                                <td colspan="7" class="text-center">Loading...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script src="assets/js/transcriber-common.js"></script>
    <script>
        // Load Dashboard Data
        async function loadDashboard() {
            try {
                // Load Statistics
                const stats = await apiGet('dashboard');
                if (stats.success) {
                    const data = stats.data || stats.stats || {};
                    $('assignedOrders').textContent = data.assignedOrders || 0;
                    $('inProgressOrders').textContent = data.inProgressOrders || 0;
                    $('completedOrders').textContent = data.completedOrders || 0;
                    $('totalEarnings').textContent = formatCurrency(data.totalEarnings);
                }

                // Load Recent Orders
                const orders = await apiGet('orders');
                if (orders.success) {
                    displayRecentOrders(orders.data || orders.orders || []);
                }
            } catch (error) {
                console.error('Error loading dashboard:', error);
            }
        }

        // Display Recent Orders
        function displayRecentOrders(orders) {
            const tbody = $('recentOrdersTable');
            if (orders.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" class="text-center">No orders assigned yet</td></tr>';
                return;
            }

            tbody.innerHTML = orders.slice(0, 10).map(order => `
                <tr>
                    <td><strong>${order.order_number}</strong></td>
                    <td>${order.client_name}</td>
                    <td>${order.service_type || 'Standard'}</td>
                    <td>${getStatusBadge(order.status)}</td>
                    <td>${getTimeRemaining(order.deadline)}</td>
                    <td>${formatCurrency(order.estimated_cost)}</td>
                    <td>
                        ${order.status === 'assigned' ? 
                            `<button class="btn btn-primary btn-sm" onclick="startOrder(${order.id})">
                                <i class="fas fa-play"></i> Start
                            </button>` : 
                        order.status === 'in_progress' ?
                            `<button class="btn btn-success btn-sm" onclick="completeOrder(${order.id})">
                                <i class="fas fa-check"></i> Complete
                            </button>` :
                            `<a href="my-orders.html?id=${order.id}" class="btn btn-outline btn-sm">View</a>`
                        }
                    </td>
                </tr>
            `).join('');
        }

        // Initialize
        loadDashboard();

        // Auto-refresh every 30 seconds
        setInterval(loadDashboard, 30000);
    </script>
</body>
</html>
