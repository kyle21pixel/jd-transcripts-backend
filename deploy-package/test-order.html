<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Order Form - JD Reporting Company</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            line-height: 1.6;
            color: #333;
            background: #f8fafc;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        h1 {
            color: #2563eb;
            margin-bottom: 20px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #374151;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #d1d5db;
            border-radius: 5px;
            font-size: 16px;
        }

        textarea {
            min-height: 100px;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            display: block;
            width: 100%;
            margin-top: 20px;
        }

        button:hover {
            background: #1d4ed8;
        }

        .success-message, .error-message {
            padding: 15px;
            border-radius: 5px;
            margin-top: 20px;
            display: none;
        }

        .success-message {
            background: #10b981;
            color: white;
        }

        .error-message {
            background: #ef4444;
            color: white;
        }

        .loading {
            display: none;
            text-align: center;
            margin-top: 20px;
        }

        .loading i {
            font-size: 24px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Test Order Form</h1>
        <form id="orderForm">
            <div class="form-group">
                <label for="clientName">Your Name</label>
                <input type="text" id="clientName" name="clientName" required>
            </div>

            <div class="form-group">
                <label for="clientEmail">Your Email</label>
                <input type="email" id="clientEmail" name="clientEmail" value="benjaminranu21@gmail.com" required>
            </div>

            <div class="form-group">
                <label for="clientPhone">Your Phone</label>
                <input type="tel" id="clientPhone" name="clientPhone">
            </div>

            <div class="form-group">
                <label for="serviceType">Service Type</label>
                <select id="serviceType" name="serviceType" required>
                    <option value="Legal Transcription">Legal Transcription</option>
                    <option value="Medical Transcription">Medical Transcription</option>
                    <option value="Business Meetings">Business Meetings</option>
                    <option value="Academic & Research">Academic & Research</option>
                </select>
            </div>

            <div class="form-group">
                <label for="turnaround">Turnaround Time</label>
                <select id="turnaround" name="turnaround" required>
                    <option value="Standard (3-5 days)">Standard (3-5 days)</option>
                    <option value="Expedited (1-2 days)">Expedited (1-2 days)</option>
                    <option value="Rush (24 hours)">Rush (24 hours)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="instructions">Special Instructions</label>
                <textarea id="instructions" name="instructions"></textarea>
            </div>

            <button type="submit" id="submitBtn">Submit Order</button>
        </form>

        <div class="loading" id="loading">
            <i class="fas fa-spinner"></i>
            <p>Processing your order...</p>
        </div>

        <div class="success-message" id="successMessage">
            <h3>Order Submitted Successfully!</h3>
            <p>Your order has been received. You will receive a confirmation email shortly.</p>
            <p>Order ID: <span id="orderId"></span></p>
        </div>

        <div class="error-message" id="errorMessage">
            <h3>Error Submitting Order</h3>
            <p id="errorText">There was an error processing your order. Please try again.</p>
        </div>
    </div>

    <script>
        document.getElementById('orderForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            // Show loading
            document.getElementById('loading').style.display = 'block';
            document.getElementById('submitBtn').disabled = true;
            
            // Hide messages
            document.getElementById('successMessage').style.display = 'none';
            document.getElementById('errorMessage').style.display = 'none';
            
            // Get form data
            const formData = {
                clientName: document.getElementById('clientName').value,
                clientEmail: document.getElementById('clientEmail').value,
                clientPhone: document.getElementById('clientPhone').value,
                serviceType: document.getElementById('serviceType').value,
                turnaround: document.getElementById('turnaround').value,
                instructions: document.getElementById('instructions').value,
                estimatedCost: '$99.99', // Placeholder
                dueDate: new Date(Date.now() + 5 * 24 * 60 * 60 * 1000).toISOString() // 5 days from now
            };
            
            try {
                // Send order to API
                const response = await fetch('https://jd-transcripts-server-production.railway.app/api/orders', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(formData)
                });
                
                const result = await response.json();
                
                // Hide loading
                document.getElementById('loading').style.display = 'none';
                document.getElementById('submitBtn').disabled = false;
                
                if (result.success) {
                    // Show success message
                    document.getElementById('orderId').textContent = result.data.orderId;
                    document.getElementById('successMessage').style.display = 'block';
                    
                    // Reset form
                    document.getElementById('orderForm').reset();
                } else {
                    // Show error message
                    document.getElementById('errorText').textContent = result.message || 'There was an error processing your order. Please try again.';
                    document.getElementById('errorMessage').style.display = 'block';
                }
            } catch (error) {
                console.error('Error submitting order:', error);
                
                // Hide loading
                document.getElementById('loading').style.display = 'none';
                document.getElementById('submitBtn').disabled = false;
                
                // Show error message
                document.getElementById('errorText').textContent = 'There was an error connecting to the server. Please try again later.';
                document.getElementById('errorMessage').style.display = 'block';
            }
        });
    </script>
</body>
</html>
