<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transcriber Login - JD Legal Transcripts</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
            width: 100%;
            max-width: 400px;
            animation: slideUp 0.6s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-header {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            padding: 2rem;
            text-align: center;
        }

        .login-header h1 {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .login-header p {
            opacity: 0.9;
            font-size: 0.9rem;
        }

        .login-form {
            padding: 2rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: #374151;
        }

        .form-group input {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid #e5e7eb;
            border-radius: 0.5rem;
            font-size: 1rem;
            transition: all 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #10b981;
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.1);
        }

        .password-container {
            position: relative;
        }

        .password-toggle {
            position: absolute;
            right: 0.75rem;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #6b7280;
            cursor: pointer;
            font-size: 1rem;
        }

        .login-btn {
            width: 100%;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            border: none;
            padding: 0.875rem;
            border-radius: 0.5rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(16, 185, 129, 0.3);
        }

        .login-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .error-message {
            background: #fee2e2;
            color: #dc2626;
            padding: 0.75rem;
            border-radius: 0.5rem;
            margin-bottom: 1rem;
            display: none;
            font-size: 0.9rem;
        }

        .error-message.show {
            display: block;
        }

        .forgot-password {
            text-align: center;
            margin-top: 1rem;
        }

        .forgot-password a {
            color: #10b981;
            text-decoration: none;
            font-size: 0.9rem;
        }

        .forgot-password a:hover {
            text-decoration: underline;
        }

        .loading {
            display: none;
        }

        .loading.show {
            display: inline-block;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .back-to-site {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-weight: 500;
            transition: opacity 0.3s;
        }

        .back-to-site:hover {
            opacity: 0.8;
        }

        .admin-login-link {
            text-align: center;
            margin-top: 1rem;
            font-size: 0.9rem;
            color: #6b7280;
        }

        .admin-login-link a {
            color: #10b981;
            text-decoration: none;
            font-weight: 500;
        }

        .admin-login-link a:hover {
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .login-container {
                margin: 0 10px;
            }
            
            .back-to-site {
                position: relative;
                top: 0;
                left: 0;
                color: #10b981;
                margin-bottom: 1rem;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <a href="index.html" class="back-to-site">
        <i class="fas fa-arrow-left"></i>
        Back to Website
    </a>

    <div class="login-container">
        <div class="login-header">
            <h1><i class="fas fa-headset"></i> Transcriber Login</h1>
            <p>JD Legal Transcripts Portal</p>
        </div>

        <form class="login-form" id="loginForm">
            <div id="errorMessage" class="error-message">
                <i class="fas fa-exclamation-triangle"></i>
                <span id="errorText">Invalid credentials. Please try again.</span>
            </div>

            <div class="form-group">
                <label for="username">Email</label>
                <input type="email" id="username" name="username" required autocomplete="username">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="password-container">
                    <input type="password" id="password" name="password" required autocomplete="current-password">
                    <button type="button" class="password-toggle" onclick="togglePassword()">
                        <i class="fas fa-eye" id="passwordIcon"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="login-btn" id="loginBtn">
                <i class="fas fa-spinner loading" id="loadingIcon"></i>
                <i class="fas fa-sign-in-alt" id="loginIcon"></i>
                <span id="loginText">Login to Portal</span>
            </button>

            <div class="forgot-password">
                <a href="#" onclick="showForgotPassword()">Forgot Password?</a>
            </div>
        </form>
    </div>

    <script>
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const passwordIcon = document.getElementById('passwordIcon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                passwordIcon.className = 'fas fa-eye-slash';
            } else {
                passwordInput.type = 'password';
                passwordIcon.className = 'fas fa-eye';
            }
        }

        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            const errorText = document.getElementById('errorText');
            errorText.textContent = message;
            errorDiv.classList.add('show');
            
            setTimeout(() => {
                errorDiv.classList.remove('show');
            }, 5000);
        }

        function showLoading(show) {
            const loginBtn = document.getElementById('loginBtn');
            const loadingIcon = document.getElementById('loadingIcon');
            const loginIcon = document.getElementById('loginIcon');
            const loginText = document.getElementById('loginText');
            
            if (show) {
                loginBtn.disabled = true;
                loadingIcon.classList.add('show');
                loginIcon.style.display = 'none';
                loginText.textContent = 'Logging in...';
            } else {
                loginBtn.disabled = false;
                loadingIcon.classList.remove('show');
                loginIcon.style.display = 'inline-block';
                loginText.textContent = 'Login to Portal';
            }
        }

        function showForgotPassword() {
            alert('Please contact the system administrator to reset your password.\nEmail: support@jdlegaltranscripts.com\nPhone: +1 (555) 123-4567');
        }

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            showLoading(true);
            
            // FOR TESTING ONLY: Accept any credentials with test@example.com/password123
            if (username === 'test@example.com' && password === 'password123') {
                // Store user info for testing
                localStorage.setItem('userToken', 'test-token-12345');
                localStorage.setItem('userLoggedIn', 'true');
                localStorage.setItem('userEmail', username);
                localStorage.setItem('userName', 'Test Transcriber');
                localStorage.setItem('userRole', 'transcriber');
                localStorage.setItem('userLoginTime', new Date().toISOString());
                
                // Redirect to dashboard
                window.location.href = 'user-dashboard.html';
                return;
            }
            
            try {
                // In a production environment, this would call the backend API
                // For now, we'll simulate a failed login for any other credentials
                
                // Uncomment this code when backend is ready:
                /*
                const API_BASE_URL = 'http://localhost:5000';
                const response = await fetch(`${API_BASE_URL}/api/auth/transcriber/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ email: username, password })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    // Store authentication token and user info
                    localStorage.setItem('userToken', result.data.token);
                    localStorage.setItem('userLoggedIn', 'true');
                    localStorage.setItem('userEmail', result.data.user.email);
                    localStorage.setItem('userName', result.data.user.name);
                    localStorage.setItem('userRole', 'transcriber');
                    localStorage.setItem('userLoginTime', new Date().toISOString());
                    
                    // Redirect to dashboard
                    window.location.href = 'user-dashboard.html';
                } else {
                    showLoading(false);
                    showError(result.message || 'Invalid email or password. Please try again.');
                    
                    // Clear form
                    document.getElementById('password').value = '';
                }
                */
                
                // For now, show error for any credentials other than the test account
                showLoading(false);
                showError('Invalid email or password. Please try again. (Hint: Use test@example.com / password123 for testing)');
                
                // Clear form
                document.getElementById('password').value = '';
            } catch (error) {
                console.error('Login error:', error);
                showLoading(false);
                showError('Login failed. Please check your connection and try again.');
                
                // Clear form
                document.getElementById('password').value = '';
            }
        });

        // Check if already logged in
        if (localStorage.getItem('userLoggedIn') === 'true') {
            window.location.href = 'user-dashboard.html';
        }

        // Auto-focus username field
        document.getElementById('username').focus();

        // Handle Enter key in form fields
        document.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                document.getElementById('loginForm').dispatchEvent(new Event('submit'));
            }
        });
    </script>
</body>
</html>
